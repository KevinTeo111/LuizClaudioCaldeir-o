# Quality gate for the portfolio: every push and pull request must install,
# typecheck, lint and build cleanly.
#
# Deployment is handled by Vercel's GitHub integration on the connected
# repository: each push to main becomes a production deployment and each
# pull request a preview, with no tokens or secrets required here.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · lint · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build
